<link rel="manifest" href="./manifest.json">

body {

  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;

  overscroll-behavior-y: none;         /* evita recargar sin querer al jalar hacia abajo */
}
button, input, select, textarea { font-family: inherit; }
/* Marco de la app: tarjeta centrada en computadora, pantalla completa en celular */
.app-shell { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
.app-frame {

  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
@media (max-width: 520px) {
  .app-shell { padding: 0; align-items: stretch; }
  .app-frame { max-width: none; max-height: none; height: 100vh; height: 100dvh; border-radius: 0; border: 0; box-shadow: none; }
}
/* Espacio para la muesca / barra de estado del iPhone y la barra de gestos */
