<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elegancia Grooming</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#1B2838">
<style>html,body{margin:0;height:100%;background:#1B2838;color:#fff;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center}</style>
</head><body><p id="m">Abriendo Elegancia…</p>
<script>
(function(){
  var K='eleg-ultima', FALLBACK='elegancia-v6.html', ir=function(n){ location.replace('./'+n); };
  var n=function(f){var m=/^elegancia-v(\d+)(?:-(\d+))?\.html$/.exec(f);return m?(+m[1])*1000+(+m[2]||0):-1;};
  var guardada=null; try{guardada=localStorage.getItem(K);}catch(e){}
  var repo=location.pathname.split('/').filter(Boolean)[0], owner=location.hostname.split('.')[0];
  if(!repo||location.hostname.indexOf('github.io')<0){ ir(guardada||FALLBACK); return; }
  var t=setTimeout(function(){ ir(guardada||FALLBACK); },4000);
  fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/').then(function(r){return r.json();}).then(function(l){
    clearTimeout(t);
    var best=null; (l||[]).forEach(function(x){ if(x&&x.name&&n(x.name)>=0&&(!best||n(x.name)>n(best))) best=x.name; });
    best=best||guardada||FALLBACK; try{localStorage.setItem(K,best);}catch(e){} ir(best);
  }).catch(function(){ clearTimeout(t); ir(guardada||FALLBACK); });
})();
</script></body></html>
